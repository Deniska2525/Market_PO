# Blueprint для хостинга Render: база данных, API (Docker) и сайт (статический).
# Инструкция: docs/RENDER.md. Проверить файл можно в VS Code с расширением YAML по схеме
# https://render.com/schema/render.yaml.json

databases:
  - name: showcase-db
    plan: free              # бесплатная база живёт 30 дней, см. docs/RENDER.md
    databaseName: showcase
    user: showcase

services:
  # ---------------------------------------------------------------- API
  - type: web
    name: univ-showcase-api   # адрес станет https://univ-showcase-api.onrender.com, если имя свободно
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: showcase-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENV
        value: production
      # Демо-факультеты и карточки при первом запуске. Демо-аккаунты с публичными паролями
      # не создаются: вместо них создаётся суперадмин из переменных ниже
      - key: SEED_DEMO_USERS
        value: "true"
      - key: SUPERUSER_USERNAME
        sync: false           # Render спросит значение при создании Blueprint
      - key: SUPERUSER_EMAIL
        sync: false
      - key: SUPERUSER_PASSWORD
        sync: false
      # Диска на бесплатном тарифе нет: изображения храним в базе
      - key: MEDIA_STORAGE
        value: db
      # Сайт обращается к API через прокси /api, поэтому cookie сессии привязана к этому пути
      - key: REFRESH_COOKIE_PATH
        value: /api/users

  # ---------------------------------------------------------------- сайт
  - type: web
    name: univ-showcase
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # Запросы к API идут на тот же адрес, что и сайт: /api/... Это прокси ниже. Так браузер
      # видит сайт и API как один сайт, и cookie входа работает без собственного домена
      - key: VITE_API_BASE_URL
        value: /api
      - key: NODE_VERSION
        value: "20"
    routes:
      # ВАЖНО: если адрес API у вас отличается (в имени появился суффикс), поправьте destination
      # здесь или в панели: сайт → Redirects/Rewrites. Порядок правил важен: сначала /api
      - type: rewrite
        source: /api/*
        destination: https://univ-showcase-api.onrender.com/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
